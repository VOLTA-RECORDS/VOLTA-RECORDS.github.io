<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Artist Dashboard — Volta Records</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600;700&display=swap');
  body{margin:0;background:#0b0b0f;color:#f4f0e8;font-family:'Inter',sans-serif;}
  header{display:flex;justify-content:space-between;align-items:center;padding:18px 22px;border-bottom:1px solid rgba(255,255,255,0.08);}
  header h1{font-family:'Anton',sans-serif;text-transform:uppercase;font-size:1.2em;margin:0;}
  header h1 span{color:#e8b84b;}
  #logout{background:none;border:1px solid rgba(255,255,255,0.2);color:#9a97a6;padding:8px 14px;border-radius:20px;font-size:0.8em;cursor:pointer;}
  main{max-width:600px;margin:0 auto;padding:24px 20px 60px;}
  .welcome{color:#9a97a6;margin-bottom:28px;}
  .welcome b{color:#f4f0e8;}
  section{background:#141319;border:1px solid rgba(255,255,255,0.08);border-radius:8px;padding:22px;margin-bottom:20px;}
  section h2{font-size:1.05em;margin:0 0 16px;text-transform:uppercase;letter-spacing:0.5px;color:#e8b84b;}
  label{display:block;font-size:0.78em;color:#9a97a6;text-transform:uppercase;letter-spacing:0.5px;margin:12px 0 6px;}
  input,textarea{width:100%;padding:11px 13px;background:#0b0b0f;border:1px solid rgba(255,255,255,0.12);color:#f4f0e8;border-radius:4px;font-size:0.92em;font-family:'Inter',sans-serif;}
  textarea{resize:vertical;min-height:80px;}
  button.submit{margin-top:16px;width:100%;padding:13px;background:#7c5cff;color:#fff;border:none;border-radius:4px;font-weight:700;cursor:pointer;}
  .msg{margin-top:10px;font-size:0.85em;}
  .ok{color:#8fe08f;} .err{color:#ff8080;}
  .release-item{border-left:3px solid #e8b84b;padding:10px 14px;margin-bottom:10px;background:#0b0b0f;border-radius:4px;}
  .release-item .status{font-size:0.72em;text-transform:uppercase;color:#9a97a6;letter-spacing:0.5px;}
  .release-item .status.pending{color:#e8b84b;}
  .release-item .status.approved{color:#8fe08f;}
</style>
</head>
<body>

<header>
  <h1>Volta <span>Artist</span></h1>
  <button id="logout">Log out</button>
</header>

<main>
  <p class="welcome">Welcome, <b id="artistName">...</b></p>

  <section style="text-align:center;">
    <div id="profilePhotoPreview" style="width:88px;height:88px;border-radius:50%;margin:0 auto 14px;background:linear-gradient(135deg,#7c5cff,#e8b84b);display:flex;align-items:center;justify-content:center;font-family:'Anton',sans-serif;font-size:1.6em;color:#0b0b0f;overflow:hidden;"></div>
    <button class="submit" id="photoUploadBtn" style="max-width:220px;margin:0 auto;">Change Profile Photo</button>
    <input type="file" id="photoFileInput" accept="image/*" style="display:none;">
    <div class="msg" id="photoMsg" style="margin-top:8px;"></div>
  </section>

  <section>
    <h2>Submit a Release</h2>
    <label>Track title</label>
    <input type="text" id="title">
    <label>Description</label>
    <textarea id="desc" placeholder="Genre, mood, story behind it..."></textarea>
    <label>Link (Audiomack, YouTube, etc.)</label>
    <input type="text" id="link">
    <button class="submit" id="submitRelease">Submit for Review</button>
    <div class="msg" id="releaseMsg"></div>
  </section>

  <section>
    <h2>Your Submissions</h2>
    <div id="myReleases">Loading...</div>
  </section>

  <section>
    <h2>Edit Bio</h2>
    <label>Your bio</label>
    <textarea id="bio" placeholder="Tell fans and promoters about yourself..."></textarea>
    <button class="submit" id="saveBio">Save Bio</button>
    <div class="msg" id="bioMsg"></div>
  </section>

  <section id="contractSection" style="display:none;">
    <h2>Your Contract</h2>
    <div id="contractStatusBanner" style="display:none;padding:12px 14px;background:rgba(143,224,143,0.1);border:1px solid rgba(143,224,143,0.3);border-radius:6px;margin-bottom:14px;color:#8fe08f;font-size:0.9em;"></div>
    <h3 id="contractTitleDisplay" style="margin-bottom:10px;"></h3>
    <div id="contractTextDisplay" style="white-space:pre-wrap;background:#0b0b0f;border:1px solid rgba(255,255,255,0.1);border-radius:6px;padding:16px;font-size:0.88em;color:#cfcbd9;max-height:280px;overflow-y:auto;margin-bottom:16px;line-height:1.5;"></div>
    <div id="signBlock">
      <p style="font-size:0.82em;color:#9a97a6;margin-bottom:12px;">By typing your full legal name below and checking the box, you confirm you have read and agree to the terms above. This creates a timestamped digital record of your consent.</p>
      <label>Type your full legal name</label>
      <input type="text" id="signName" placeholder="Full legal name">
      <label style="display:flex;align-items:center;gap:8px;margin-top:12px;font-size:0.85em;color:#cfcbd9;">
        <input type="checkbox" id="agreeCheckbox" style="width:auto;">
        I have read and agree to the terms of this contract, the Terms & Conditions, and Privacy Policy.
      </label>
      <button class="submit" id="signContractBtn" style="margin-top:14px;">Sign Contract</button>
      <div class="msg" id="signMsg"></div>
    </div>
  </section>
</main>

<div id="chatContainer"></div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { getFirestore, doc, getDoc, setDoc, updateDoc, collection, addDoc, query, where, getDocs, serverTimestamp, orderBy } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
  import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";
  import { mountChat } from "./chat.js";

  const firebaseConfig = {
    apiKey: "AIzaSyC0Y51ipqSxtP8lgZhhdM_vUrqTIkm2VQo",
    authDomain: "volta-records-7647c.firebaseapp.com",
    projectId: "volta-records-7647c",
    storageBucket: "volta-records-7647c.firebasestorage.app",
    messagingSenderId: "965622035230",
    appId: "1:965622035230:web:59184ef3b9b42504978f0f"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);
  const storage = getStorage(app);
  let currentUser = null;

  function showProfilePhoto(data, name){
    const preview = document.getElementById('profilePhotoPreview');
    if(data.photoURL){
      preview.innerHTML = `<img src="${data.photoURL}" style="width:100%;height:100%;object-fit:cover;">`;
    } else {
      const parts = (name || '?').trim().split(/\s+/);
      preview.textContent = ((parts[0]?.[0]||'') + (parts[1]?.[0]||'')).toUpperCase() || name[0].toUpperCase();
    }
  }

  onAuthStateChanged(auth, async (user) => {
    if(!user){ window.location.href = 'login.html'; return; }
    currentUser = user;
    const userDoc = await getDoc(doc(db, "users", user.uid));
    const data = userDoc.data();
    if(data.role !== 'artist'){ window.location.href = 'login.html'; return; }
    document.getElementById('artistName').textContent = data.name || user.email;
    document.getElementById('bio').value = data.bio || '';
    showProfilePhoto(data, data.name || user.email);
    loadReleases();
    loadContract(user.uid);
    mountChat(document.getElementById('chatContainer'), user.uid, 'artist', data.name || user.email);
  });

  document.getElementById('photoUploadBtn').addEventListener('click', () => document.getElementById('photoFileInput').click());
  document.getElementById('photoFileInput').addEventListener('change', async () => {
    const file = document.getElementById('photoFileInput').files[0];
    if(!file || !currentUser) return;
    const msg = document.getElementById('photoMsg');
    msg.textContent = 'Uploading...';
    msg.className = 'msg';
    try{
      const path = `profile_photos/${currentUser.uid}/${Date.now()}_${file.name}`;
      const fileRef = ref(storage, path);
      await uploadBytes(fileRef, file);
      const url = await getDownloadURL(fileRef);
      await updateDoc(doc(db, "users", currentUser.uid), { photoURL: url });
      document.getElementById('profilePhotoPreview').innerHTML = `<img src="${url}" style="width:100%;height:100%;object-fit:cover;">`;
      msg.textContent = 'Profile photo updated.';
      msg.className = 'msg ok';
    }catch(e){
      msg.textContent = 'Upload failed.';
      msg.className = 'msg err';
    }
  });

  document.getElementById('logout').addEventListener('click', () => signOut(auth).then(() => window.location.href = 'login.html'));

  document.getElementById('submitRelease').addEventListener('click', async () => {
    const title = document.getElementById('title').value.trim();
    const desc = document.getElementById('desc').value.trim();
    const link = document.getElementById('link').value.trim();
    const msg = document.getElementById('releaseMsg');

    if(!title){ msg.textContent = 'Track title is required.'; msg.className='msg err'; return; }

    await addDoc(collection(db, "releases"), {
      title, desc, link,
      artistId: currentUser.uid,
      artistName: document.getElementById('artistName').textContent,
      status: 'pending',
      createdAt: serverTimestamp()
    });

    msg.textContent = 'Submitted! Awaiting admin approval.';
    msg.className = 'msg ok';
    document.getElementById('title').value = '';
    document.getElementById('desc').value = '';
    document.getElementById('link').value = '';
    loadReleases();
  });

  document.getElementById('saveBio').addEventListener('click', async () => {
    const bio = document.getElementById('bio').value.trim();
    await updateDoc(doc(db, "users", currentUser.uid), { bio });
    const msg = document.getElementById('bioMsg');
    msg.textContent = 'Bio saved.';
    msg.className = 'msg ok';
  });

  async function loadContract(uid){
    const contractSnap = await getDoc(doc(db, "contracts", uid));
    if(!contractSnap.exists()) return;

    document.getElementById('contractSection').style.display = 'block';
    const c = contractSnap.data();
    document.getElementById('contractTitleDisplay').textContent = c.title;
    document.getElementById('contractTextDisplay').textContent = c.text;

    const sigSnap = await getDoc(doc(db, "signatures", uid));
    if(sigSnap.exists()){
      const s = sigSnap.data();
      const banner = document.getElementById('contractStatusBanner');
      const signedDate = s.agreedAt && s.agreedAt.toDate ? s.agreedAt.toDate().toLocaleString() : 'previously';
      banner.textContent = `✓ Signed as "${s.typedName}" on ${signedDate}`;
      banner.style.display = 'block';
      document.getElementById('signBlock').style.display = 'none';
    }
  }

  document.getElementById('signContractBtn').addEventListener('click', async () => {
    const typedName = document.getElementById('signName').value.trim();
    const agreed = document.getElementById('agreeCheckbox').checked;
    const msg = document.getElementById('signMsg');

    if(!typedName){ msg.textContent = 'Type your full legal name.'; msg.className = 'msg err'; return; }
    if(!agreed){ msg.textContent = 'You must check the agreement box.'; msg.className = 'msg err'; return; }

    await setDoc(doc(db, "signatures", currentUser.uid), {
      typedName,
      agreedAt: serverTimestamp(),
      userAgent: navigator.userAgent
    });

    msg.textContent = 'Contract signed successfully.';
    msg.className = 'msg ok';
    loadContract(currentUser.uid);
  });

  async function loadReleases(){
    const q = query(collection(db, "releases"), where("artistId", "==", currentUser.uid));
    const snap = await getDocs(q);
    const container = document.getElementById('myReleases');
    if(snap.empty){ container.innerHTML = '<p style="color:#9a97a6;font-size:0.9em;">No submissions yet.</p>'; return; }
    container.innerHTML = '';
    snap.forEach(d => {
      const r = d.data();
      const div = document.createElement('div');
      div.className = 'release-item';
      div.innerHTML = `<div class="status ${r.status}">${r.status}</div><div>${r.title}</div>`;
      container.appendChild(div);
    });
  }
</script>

</body>
</html>
